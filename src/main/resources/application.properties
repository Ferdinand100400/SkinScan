spring.profiles.active=local

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jackson.encoding=UTF-8

spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/docs

app.security.cors.allowedOrigins=http://localhost:8080
app.security.cors.allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.security.cors.allowedHeaders="*"
app.security.cors.allowCredentials=true
# Cleaning every 5 minutes
app.rateLimiting.cleanupIntervalSeconds=300
# Maximum number of keys in memory
app.rateLimiting.maxKeys=10000
# max 5 register
app.rateLimiting.register.limit=5
app.rateLimiting.register.windowSeconds=60
# 10 login attempts
app.rateLimiting.login.limit=10
app.rateLimiting.login.windowSeconds=60

# limited size multipart-request (for photos), MBytes
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Base path and pattern path for storage photo
app.storage.base-path=./data/uploads
app.storage.path-pattern={user-id}/{year}/{month}/{uuid}.{ext}



# ASYNC

# Mode processing: async or in future rabbitmq
app.processing.mode=async
# config pull
app.async.core-pool-size=5
app.async.max-pool-size=10
app.async.queue-capacity=100
app.async.thread-name-prefix=PhotoProcessor-
app.async.keep-alive-seconds=60
# Interval start scheduling in sec
app.recovery.interval-ms=120000
# ?????: ??????? ????? ???? ????? ???? ? PROCESSING ?? ??????????????
app.recovery.stuck-threshold-minutes=5
# ?????????? ???? ?? ???? ??????
app.recovery.batch-size=10

# Properties ML stub
app.ml.client.stub.delay-min=3000
app.ml.client.stub.delay-max=5000
app.ml.client.stub.failure-probability=0.05
app.ml.client.stub.simulate-timeout=false
app.ml.client.stub.timeout-delay-ms=30000

spring.jpa.properties.hibernate.type.json_mapper=com.fasterxml.jackson.databind.ObjectMapper
