spring.profiles.active=local

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

spring.jackson.encoding=UTF-8

spring.sql.init.mode=never
spring.sql.init.continue-on-error=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/docs

app.security.cors.allowedOrigins=http://localhost:8080
app.security.cors.allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.security.cors.allowedHeaders="*"
app.security.cors.allowCredentials=true
# Cleaning every 5 minutes
app.rateLimiting.cleanupIntervalSeconds=300
# Maximum number of keys in memory
app.rateLimiting.maxKeys=10000
# max 5 register
app.rateLimiting.register.limit=5
app.rateLimiting.register.windowSeconds=60
# 10 login attempts
app.rateLimiting.login.limit=10
app.rateLimiting.login.windowSeconds=60
